name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static analysis
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build Docker image
        run: docker build -t devops-task-board:ci .

      - name: Smoke test container
        run: |
          docker run -d --name task-board-ci -p 3000:3000 devops-task-board:ci
          sleep 10
          node scripts/smoke-test.js
          docker logs task-board-ci
          docker rm -f task-board-ci
